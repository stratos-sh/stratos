# AWSNodeClass for Bottlerocket OS
#
# This AWSNodeClass defines AWS EC2 configuration for Bottlerocket-based nodes.
# Use with NodePools that require Bottlerocket nodes.
#
# Bottlerocket uses TOML configuration and doesn't support arbitrary shell scripts.
# Use ControllerStop completion mode in the NodePool to have Stratos manage the
# warmup-to-standby transition by stopping instances when nodes become Ready.

apiVersion: stratos.sh/v1alpha1
kind: AWSNodeClass
metadata:
  name: bottlerocket-standard
spec:
  # AWS Region (defaults to controller's region if not specified)
  region: <YOUR_AWS_REGION>

  # Instance type - x86_64 for Bottlerocket
  instanceType: m5.large

  # Bottlerocket x86_64 AMI (EKS 1.34)
  # Find your region's AMI: aws ssm get-parameter --name /aws/service/bottlerocket/aws-k8s-1.34/x86_64/latest/image_id
  ami: <YOUR_AMI_ID>

  # Subnets for instance placement - instances distributed round-robin
  subnetIds:
    - <YOUR_SUBNET_ID>

  # Security groups for instances
  securityGroupIds:
    - <YOUR_SECURITY_GROUP_ID>

  # IAM instance profile for node permissions
  iamInstanceProfile: <YOUR_IAM_INSTANCE_PROFILE_ARN>

  # Bottlerocket requires two volumes: root (small) and data
  blockDeviceMappings:
    - deviceName: /dev/xvda  # Root volume (OS)
      volumeSize: 8
      volumeType: gp3
      encrypted: true
    - deviceName: /dev/xvdb  # Data volume (containers, images)
      volumeSize: 20
      volumeType: gp3
      encrypted: true

  # Additional tags for instances
  tags:
    Environment: production
    OS: bottlerocket
    Architecture: x86_64

  # Bottlerocket TOML configuration
  # No shutdown script needed - use ControllerStop mode in NodePool
  userData: |
    [settings.kubernetes]
    cluster-name = "<YOUR_CLUSTER_NAME>"
    api-server = "<YOUR_API_SERVER_ENDPOINT>"
    cluster-certificate = "<YOUR_CLUSTER_CA_BASE64>"

    # Register with startup taint to prevent scheduling until CNI is ready
    [settings.kubernetes.node-taints]
    "node.eks.amazonaws.com/not-ready" = "true:NoSchedule"

    # Add Stratos pool label (required for Stratos to track the node)
    [settings.kubernetes.node-labels]
    "stratos.sh/pool" = "YOUR_POOL_NAME"
