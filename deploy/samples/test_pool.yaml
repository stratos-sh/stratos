# Legacy NodePool with inline cloudProvider (deprecated)
#
# NOTE: This format is deprecated. Use the new AWSNodeClass + NodePool pattern instead.
# See al2023/ or awsnodeclass_bottlerocket.yaml for the recommended approach.
#
# This example is kept for reference only.

apiVersion: stratos.sh/v1alpha1
kind: NodePool
metadata:
  name: test-pool
spec:
  minStandby: 2
  poolSize: 2
  preWarm:
    timeout: 10m0s
    timeoutAction: stop
  reconciliationInterval: 30s
  scaleDown:
    drainTimeout: 2m0s
    emptyNodeTTL: 2m0s
    enabled: true
  template:
    cloudProvider:
      aws:
        ami: <YOUR_AMI_ID>
        blockDeviceMappings:
        - deviceName: /dev/xvda
          encrypted: true
          volumeSize: 20
          volumeType: gp3
        iamInstanceProfile: <YOUR_IAM_INSTANCE_PROFILE_ARN>
        instanceType: m5.large
        region: <YOUR_AWS_REGION>
        securityGroupIds:
        - <YOUR_SECURITY_GROUP_ID>
        subnetIds:
        - <YOUR_SUBNET_ID>
        tags:
          Environment: test
        userData: |
          #!/bin/bash
          set -ex

          /etc/eks/bootstrap.sh <YOUR_CLUSTER_NAME> \
            --kubelet-extra-args '--register-with-taints=node.eks.amazonaws.com/not-ready=true:NoSchedule'

          echo "DEBUG: bootstrap.sh completed, waiting for kubelet to be healthy..."

          until curl -sf http://localhost:10248/healthz >/dev/null 2>&1; do
            echo "DEBUG: kubelet not healthy yet..."
            sleep 5
          done
          echo "DEBUG: kubelet is healthy"

          sleep 30

          echo "DEBUG: shutting down..."
          poweroff
      provider: aws
    labels:
      stratos.sh/pool: test-pool
    startupTaintRemoval: WhenNetworkReady
    startupTaints:
    - effect: NoSchedule
      key: node.eks.amazonaws.com/not-ready
      value: "true"
