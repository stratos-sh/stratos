# AWSNodeClass using dynamic resource selectors
#
# This AWSNodeClass uses selectors to dynamically discover AWS resources
# instead of hardcoding IDs. Resources are resolved by the AWSNodeClass
# controller and the resolved IDs are stored in .status.
#
# Alternative to the static ID approach in awsnodeclass_bottlerocket.yaml

apiVersion: stratos.sh/v1alpha1
kind: AWSNodeClass
metadata:
  name: dynamic-standard
spec:
  # Instance type
  instanceType: m5.large

  # Dynamically select the newest AMI matching these criteria
  amiSelector:
    name: "my-eks-ami-*"
    owner: self
    tags:
      kubernetes.io/os: linux
      stratos.sh/managed: "true"

  # Discover subnets by tags (all matching subnets will be used for round-robin)
  subnetSelector:
    tags:
      stratos.sh/discovery: <YOUR_CLUSTER_NAME>

  # Discover security groups by tags
  securityGroupSelector:
    tags:
      stratos.sh/discovery: main
  # Automatic instance profile management from IAM role
  # Stratos will create/manage the instance profile automatically
  role: EKSNodeRole

  # Enforce IMDSv2 for security
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2

  blockDeviceMappings:
    - deviceName: /dev/xvda
      volumeSize: 20
      volumeType: gp3
      encrypted: true

  tags:
    Environment: production
    ManagedBy: stratos

  userData: |
    #!/bin/bash
    set -o xtrace
    /etc/eks/bootstrap.sh <YOUR_CLUSTER_NAME>
    # Signal warmup complete by stopping the instance
    aws ec2 stop-instances --instance-ids $(ec2-metadata -i | cut -d' ' -f2) --region $(ec2-metadata --availability-zone | cut -d' ' -f2 | sed 's/.$//')
