# Stratos NodePool Sample Configuration
#
# Startup Taints: Nodes register with a startup taint to prevent pod scheduling until
# the CNI (AWS VPC CNI, Cilium, Calico, etc.) is fully ready. This prevents
# "connection refused on port 50051" errors during pod sandbox creation.
#
# The startup taint in userData (--register-with-taints) MUST match the startupTaints
# field in the NodePool spec. Stratos removes these taints when network conditions
# indicate the CNI is ready:
# - EKS: NetworkingReady=True condition (set by eks-node-monitoring-agent)
# - Cilium: NetworkUnavailable=False with reason "CiliumIsUp"
# - Calico: NetworkUnavailable=False with reason "CalicoIsUp"
---
apiVersion: stratos.sh/v1alpha1
kind: NodePool
metadata:
  name: workers
spec:
  # Total number of nodes the pool can manage
  poolSize: 5
  # Minimum number of pre-warmed standby nodes to maintain
  minStandby: 5
  # How often to reconcile the pool state
  reconciliationInterval: 30s
  # Maximum time a node can run before being recycled (optional)
  maxNodeRuntime: 24h

  # Node template configuration
  template:
    # Labels applied to managed nodes
    labels:
      stratos.sh/pool: workers
      node-pool: workers
    # Taints applied to managed nodes (optional, permanent taints for workload isolation)
    taints:
      - key: stratos.sh/prewarmed
        value: "true"
        effect: NoSchedule
    # Startup taints - must match --register-with-taints in userData
    # Stratos removes these taints when the CNI is ready
    startupTaints:
      - key: node.eks.amazonaws.com/not-ready
        value: "true"
        effect: NoSchedule
    # How startup taints are removed:
    # - WhenNetworkReady (default): Stratos removes taints when network conditions indicate CNI ready
    # - External: Stratos waits for taints to be removed by CNI plugin or external controller
    startupTaintRemoval: WhenNetworkReady
    # Cloud provider configuration
    cloudProvider:
      provider: aws
      aws:
        region: <YOUR_AWS_REGION>
        instanceType: m5.large
        ami: <YOUR_AMI_ID>
        subnetIds:
          - <YOUR_SUBNET_ID_1>
          - <YOUR_SUBNET_ID_2>
        securityGroupIds:
          - <YOUR_SECURITY_GROUP_ID>
        iamInstanceProfile: <YOUR_IAM_INSTANCE_PROFILE_ARN>
        # User data script that joins cluster and self-stops when ready
        userData: |
          #!/bin/bash
          set -e

          # Register with startup taint to prevent pod scheduling until CNI is ready.
          # IMPORTANT: This taint MUST match the startupTaints field in the NodePool spec.
          # Stratos will remove this taint after verifying the CNI is ready.
          /etc/eks/bootstrap.sh <YOUR_CLUSTER_NAME> \
            --kubelet-extra-args '--register-with-taints=node.eks.amazonaws.com/not-ready=true:NoSchedule'

          # Wait for kubelet to be healthy
          # Note: We use the kubelet healthz endpoint because kubectl is not installed on EKS nodes
          until curl -sf http://localhost:10248/healthz >/dev/null 2>&1; do
            sleep 5
          done

          # Give time for node to fully register with API server
          sleep 30

          # Pull commonly used images (optional)
          # ctr -n k8s.io images pull docker.io/library/nginx:latest

          # Signal that warmup is complete by stopping the instance
          poweroff

        blockDeviceMappings:
          - deviceName: /dev/xvda
            volumeSize: 50
            volumeType: gp3
            encrypted: true
        tags:
          Environment: production
          Team: platform

  # Pre-warm configuration
  preWarm:
    timeout: 15m
    timeoutAction: terminate

  # Scale-up configuration
  scaleUp:
    # Default resource requests for pods without explicit requests.
    # Used in resource-based scale-up calculations to estimate node requirements.
    defaultPodResources:
      requests:
        cpu: "500m"
        memory: "1Gi"

  # Scale-down configuration
  scaleDown:
    enabled: true
    emptyNodeTTL: 5m
    drainTimeout: 5m
---
# Example with minimal configuration
apiVersion: stratos.sh/v1alpha1
kind: NodePool
metadata:
  name: ci-runners
spec:
  poolSize: 5
  minStandby: 2
  template:
    labels:
      stratos.sh/pool: ci-runners
      purpose: ci
    # Startup taints for CNI readiness
    startupTaints:
      - key: node.eks.amazonaws.com/not-ready
        value: "true"
        effect: NoSchedule
    cloudProvider:
      provider: aws
      aws:
        region: <YOUR_AWS_REGION>
        instanceType: c5.xlarge
        ami: <YOUR_AMI_ID>
        subnetIds:
          - <YOUR_SUBNET_ID>
        securityGroupIds:
          - <YOUR_SECURITY_GROUP_ID>
        iamInstanceProfile: <YOUR_IAM_INSTANCE_PROFILE_ARN>
        userData: |
          #!/bin/bash
          set -e
          # Startup taint MUST match startupTaints in spec
          /etc/eks/bootstrap.sh <YOUR_CLUSTER_NAME> \
            --kubelet-extra-args '--register-with-taints=node.eks.amazonaws.com/not-ready=true:NoSchedule'
          until curl -sf http://localhost:10248/healthz >/dev/null 2>&1; do sleep 5; done
          sleep 30
          poweroff
---
# Example with Cilium CNI (External taint removal)
apiVersion: stratos.sh/v1alpha1
kind: NodePool
metadata:
  name: cilium-workers
spec:
  poolSize: 5
  minStandby: 2
  template:
    labels:
      stratos.sh/pool: cilium-workers
    # Cilium-managed startup taint
    startupTaints:
      - key: node.cilium.io/agent-not-ready
        value: "true"
        effect: NoSchedule
    # External mode: Cilium removes the taint when the agent is ready
    startupTaintRemoval: External
    cloudProvider:
      provider: aws
      aws:
        region: <YOUR_AWS_REGION>
        instanceType: m5.large
        ami: <YOUR_AMI_ID>
        subnetIds:
          - <YOUR_SUBNET_ID>
        securityGroupIds:
          - <YOUR_SECURITY_GROUP_ID>
        iamInstanceProfile: <YOUR_IAM_INSTANCE_PROFILE_ARN>
        userData: |
          #!/bin/bash
          set -e
          # Cilium removes this taint automatically when the agent is ready
          /etc/eks/bootstrap.sh <YOUR_CLUSTER_NAME> \
            --kubelet-extra-args '--register-with-taints=node.cilium.io/agent-not-ready=true:NoSchedule'
          until curl -sf http://localhost:10248/healthz >/dev/null 2>&1; do sleep 5; done
          sleep 30
          poweroff
