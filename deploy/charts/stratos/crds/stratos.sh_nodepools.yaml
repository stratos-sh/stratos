---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: nodepools.stratos.sh
spec:
  group: stratos.sh
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    shortNames:
    - np
    - npool
    singular: nodepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolSize
      name: PoolSize
      type: integer
    - jsonPath: .spec.minStandby
      name: MinStandby
      type: integer
    - jsonPath: .status.standby
      name: Standby
      type: integer
    - jsonPath: .status.running
      name: Running
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodePool is the Schema for the nodepools API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodePoolSpec defines the desired state of NodePool
            properties:
              maxNodeRuntime:
                description: |-
                  MaxNodeRuntime configures automatic node recycling.
                  Zero or nil means disabled.
                type: string
              minStandby:
                description: MinStandby is the minimum number of nodes to maintain
                  in stopped/standby state
                format: int32
                minimum: 0
                type: integer
              poolSize:
                description: PoolSize is the maximum total nodes (standby + running,
                  excluding warmup)
                format: int32
                maximum: 1000
                minimum: 1
                type: integer
              preWarm:
                description: PreWarm configures the pre-warming lifecycle
                properties:
                  imagePullPolicy:
                    allOf:
                    - enum:
                      - Required
                      - BestEffort
                    - enum:
                      - Required
                      - BestEffort
                    default: Required
                    description: |-
                      ImagePullPolicy controls whether image pull failures block warmup completion.
                      Required (default): warmup fails if any image cannot be pulled.
                      BestEffort: warmup completes regardless of pull failures.
                    type: string
                  images:
                    description: |-
                      Images is a list of container images to pre-pull during warmup.
                      Each image is pulled using ctr and pinned to prevent kubelet GC eviction.
                    items:
                      minLength: 1
                      type: string
                    type: array
                  timeout:
                    description: |-
                      Timeout is how long to wait for warmup to complete (for node to become Ready).
                      Default: 10 minutes
                    type: string
                  timeoutAction:
                    allOf:
                    - enum:
                      - stop
                      - terminate
                    - enum:
                      - stop
                      - terminate
                    default: stop
                    description: TimeoutAction is what to do if warmup doesn't complete
                      in time.
                    type: string
                type: object
              reconciliationInterval:
                description: |-
                  ReconciliationInterval is how often to run the maintenance loop.
                  Default: 30 seconds
                type: string
              scaleDown:
                description: ScaleDown configures automatic scale-down behavior
                properties:
                  drainTimeout:
                    description: |-
                      DrainTimeout is the maximum time to wait for node drain.
                      Default: 5 minutes
                    type: string
                  emptyNodeTTL:
                    description: |-
                      EmptyNodeTTL is how long a node must be empty before scale-down.
                      Default: 5 minutes
                    type: string
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether automatic scale-down is enabled.
                      Default: true
                    type: boolean
                type: object
              scaleUp:
                description: ScaleUp configures scale-up behavior including resource-based
                  calculation
                properties:
                  defaultPodResources:
                    description: |-
                      DefaultPodResources specifies default resource requests for pods
                      that don't have explicit requests. Used in scale-up calculations
                      to estimate how many nodes are needed.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              template:
                description: Template defines the node template for this pool
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels to apply to nodes
                    type: object
                  networkReadinessStrategy:
                    default: Taint
                    description: |-
                      NetworkReadinessStrategy controls how Stratos handles network readiness.
                      "Taint" adds a stratos.sh/not-ready=true:NoSchedule taint to kubelet and
                      removes it when the CNI is ready. "None" disables network readiness management.
                      Default: Taint.
                    enum:
                    - Taint
                    - None
                    type: string
                  nodeClassRef:
                    description: |-
                      NodeClassRef references the cloud-specific NodeClass that defines
                      instance configuration (e.g., AWSNodeClass for AWS).
                    properties:
                      kind:
                        description: Kind is the NodeClass kind (e.g., "AWSNodeClass",
                          "GCPNodeClass")
                        enum:
                        - AWSNodeClass
                        type: string
                      name:
                        description: Name is the name of the NodeClass resource
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  taints:
                    description: Taints to apply to nodes (permanent taints for workload
                      isolation)
                    items:
                      description: |-
                        The node this Taint is attached to has the "effect" on
                        any pod that does not tolerate the Taint.
                      properties:
                        effect:
                          description: |-
                            Required. The effect of the taint on pods
                            that do not tolerate the taint.
                            Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: Required. The taint key to be applied to a
                            node.
                          type: string
                        timeAdded:
                          description: TimeAdded represents the time at which the
                            taint was added.
                          format: date-time
                          type: string
                        value:
                          description: The taint value corresponding to the taint
                            key.
                          type: string
                      required:
                      - effect
                      - key
                      type: object
                    type: array
                required:
                - nodeClassRef
                type: object
            required:
            - minStandby
            - poolSize
            - template
            type: object
          status:
            description: NodePoolStatus defines the observed state of NodePool
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastReconcileTime:
                description: LastReconcileTime is when the pool was last reconciled
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation
                format: int64
                type: integer
              podAssignments:
                description: |-
                  PodAssignments tracks pending pods assigned to starting nodes.
                  Prevents duplicate scale-ups during the window between node start and pod scheduling.
                items:
                  description: |-
                    PodAssignment tracks the mapping of an unschedulable pod to a node being started for it.
                    Used to prevent duplicate scale-ups when a node is starting but the pod hasn't been scheduled yet.
                  properties:
                    assignedAt:
                      description: AssignedAt is when this assignment was created
                      format: date-time
                      type: string
                    nodeName:
                      description: NodeName is the name of the node started for this
                        pod
                      type: string
                    podName:
                      description: PodName is the name of the pending pod
                      type: string
                    podNamespace:
                      description: PodNamespace is the namespace of the pending pod
                      type: string
                  required:
                  - assignedAt
                  - nodeName
                  - podName
                  - podNamespace
                  type: object
                type: array
              running:
                description: Running is the count of nodes actively running pods
                format: int32
                type: integer
              standby:
                description: Standby is the count of nodes in stopped/standby state
                format: int32
                type: integer
              total:
                description: Total is the total node count (warmup + standby + running)
                format: int32
                type: integer
              warmup:
                description: Warmup is the count of nodes currently initializing
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
