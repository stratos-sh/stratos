---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: awsnodeclasses.stratos.sh
spec:
  group: stratos.sh
  names:
    kind: AWSNodeClass
    listKind: AWSNodeClassList
    plural: awsnodeclasses
    shortNames:
    - awsnc
    singular: awsnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceType
      name: InstanceType
      type: string
    - jsonPath: .status.resolvedAMI
      name: AMI
      type: string
    - jsonPath: .status.nodePoolCount
      name: NodePools
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AWSNodeClass is the Schema for the awsnodeclasses API.
          It defines AWS EC2 configuration for nodes managed by Stratos NodePools.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AWSNodeClassSpec defines the desired state of AWSNodeClass
            properties:
              ami:
                description: AMI is the Amazon Machine Image ID (mutually exclusive
                  with amiSelector)
                pattern: ^ami-[a-z0-9]+$
                type: string
              amiSelector:
                description: AMISelector defines criteria for dynamically selecting
                  an AMI (mutually exclusive with ami)
                properties:
                  name:
                    description: Name with wildcard support (e.g., "my-eks-ami-*")
                    type: string
                  owner:
                    description: Owner account ID or alias ("self", "amazon")
                    type: string
                  tags:
                    additionalProperties:
                      type: string
                    description: Tags to match (AND semantics)
                    type: object
                type: object
              blockDeviceMappings:
                description: BlockDeviceMappings defines the EBS volumes
                items:
                  description: BlockDeviceMapping defines an EBS volume
                  properties:
                    deviceName:
                      description: DeviceName is the device name (e.g., "/dev/xvda")
                      type: string
                    encrypted:
                      description: Encrypted indicates whether the volume should be
                        encrypted
                      type: boolean
                    iops:
                      description: IOPS is the number of I/O operations per second
                        (for io1/io2 volumes)
                      format: int32
                      type: integer
                    throughput:
                      description: Throughput is the throughput in MB/s (for gp3 volumes)
                      format: int32
                      type: integer
                    volumeSize:
                      description: VolumeSize is the volume size in GiB
                      format: int32
                      minimum: 1
                      type: integer
                    volumeType:
                      description: VolumeType is the EBS volume type (e.g., "gp3",
                        "io1")
                      type: string
                  required:
                  - deviceName
                  - volumeSize
                  - volumeType
                  type: object
                type: array
              iamInstanceProfile:
                description: IAMInstanceProfile is the IAM instance profile ARN or
                  name (mutually exclusive with role)
                type: string
              instanceType:
                description: InstanceType is the EC2 instance type (e.g., "m5.large")
                type: string
              metadataOptions:
                description: MetadataOptions defines IMDS configuration for launched
                  instances
                properties:
                  httpEndpoint:
                    description: |-
                      HTTPEndpoint controls whether the IMDS endpoint is available.
                      "enabled" or "disabled".
                    enum:
                    - enabled
                    - disabled
                    type: string
                  httpPutResponseHopLimit:
                    description: HTTPPutResponseHopLimit is the HTTP PUT response
                      hop limit for IMDS token requests (1-64).
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  httpTokens:
                    description: |-
                      HTTPTokens determines whether IMDSv2 is required.
                      "required" enforces IMDSv2; "optional" allows IMDSv1 and v2.
                    enum:
                    - required
                    - optional
                    type: string
                type: object
              region:
                description: |-
                  Region is the AWS region (e.g., "us-east-1")
                  Defaults to the controller's region if not specified.
                type: string
              role:
                description: Role is the IAM role name for automatic instance profile
                  management (mutually exclusive with iamInstanceProfile)
                type: string
              securityGroupIds:
                description: SecurityGroupIDs is the list of security groups to attach
                  to instances (mutually exclusive with securityGroupSelector).
                items:
                  type: string
                minItems: 1
                type: array
              securityGroupSelector:
                description: SecurityGroupSelector defines criteria for dynamically
                  selecting security groups (mutually exclusive with securityGroupIds)
                properties:
                  name:
                    description: Name with wildcard support
                    type: string
                  tags:
                    additionalProperties:
                      type: string
                    description: Tags to match (AND semantics)
                    type: object
                type: object
              subnetIds:
                description: |-
                  SubnetIDs is the list of subnets to launch instances in (mutually exclusive with subnetSelector).
                  Instances are distributed across subnets using round-robin.
                items:
                  type: string
                minItems: 1
                type: array
              subnetSelector:
                description: SubnetSelector defines criteria for dynamically selecting
                  subnets (mutually exclusive with subnetIds)
                properties:
                  tags:
                    additionalProperties:
                      type: string
                    description: Tags to match (AND semantics)
                    type: object
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags to apply to instances in addition to Stratos-managed
                  tags
                type: object
              userData:
                description: |-
                  UserData is the base64-encoded user data script.
                  This script should join the cluster and self-stop when ready.
                type: string
            required:
            - instanceType
            type: object
            x-kubernetes-validations:
            - message: one of ami or amiSelector is required
              rule: has(self.ami) || has(self.amiSelector)
            - message: ami and amiSelector are mutually exclusive
              rule: '!(has(self.ami) && has(self.amiSelector))'
            - message: one of subnetIds or subnetSelector is required
              rule: has(self.subnetIds) || has(self.subnetSelector)
            - message: subnetIds and subnetSelector are mutually exclusive
              rule: '!(has(self.subnetIds) && has(self.subnetSelector))'
            - message: one of securityGroupIds or securityGroupSelector is required
              rule: has(self.securityGroupIds) || has(self.securityGroupSelector)
            - message: securityGroupIds and securityGroupSelector are mutually exclusive
              rule: '!(has(self.securityGroupIds) && has(self.securityGroupSelector))'
            - message: one of iamInstanceProfile or role is required
              rule: has(self.iamInstanceProfile) || has(self.role)
            - message: role and iamInstanceProfile are mutually exclusive
              rule: '!(has(self.iamInstanceProfile) && has(self.role))'
          status:
            description: AWSNodeClassStatus defines the observed state of AWSNodeClass
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the AWSNodeClass's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nodePoolCount:
                description: NodePoolCount is the number of NodePools currently referencing
                  this AWSNodeClass
                format: int32
                type: integer
              resolvedAMI:
                description: ResolvedAMI is the resolved AMI ID (from selector or
                  static field)
                type: string
              resolvedInstanceProfile:
                description: ResolvedInstanceProfile is the resolved instance profile
                  ARN
                type: string
              resolvedSecurityGroups:
                description: ResolvedSecurityGroups is the list of resolved security
                  groups with IDs and names
                items:
                  description: ResolvedSecurityGroup represents a resolved security
                    group with its ID and name.
                  properties:
                    id:
                      description: ID is the security group ID
                      type: string
                    name:
                      description: Name is the security group name
                      type: string
                  required:
                  - id
                  type: object
                type: array
              resolvedSubnets:
                description: ResolvedSubnets is the list of resolved subnets with
                  IDs and availability zones
                items:
                  description: ResolvedSubnet represents a resolved subnet with its
                    ID and availability zone.
                  properties:
                    id:
                      description: ID is the subnet ID
                      type: string
                    zone:
                      description: Zone is the availability zone of the subnet
                      type: string
                  required:
                  - id
                  - zone
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
