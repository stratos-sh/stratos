apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-spot-scaleup-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-spot-scaleup
  template:
    metadata:
      labels:
        app: e2e-spot-scaleup
    spec:
      nodeSelector:
        workload: spot-e2e
      containers:
      - name: nginx
        image: nginx:1.14.2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
