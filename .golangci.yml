version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocyclo
    - misspell
    - funlen
    - cyclop
    - depguard
    - contextcheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
        - nilness
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    cyclop:
      max-complexity: 15
      package-average: 7.0
    depguard:
      rules:
        controller-sub-no-impl:
          files:
            - "**/internal/controller/nodepool/lifecycle/**"
            - "**/internal/controller/nodepool/nodestate/**"
            - "**/internal/controller/nodeclass/**"
            - "!$test"
          deny:
            - pkg: "github.com/stratos-sh/stratos/internal/cloudprovider/aws"
              desc: "controller sub-packages must not import provider implementations directly"
            - pkg: "github.com/stratos-sh/stratos/internal/cloudprovider/fake"
              desc: "controller sub-packages must not import provider implementations directly"

  exclusions:
    paths:
      - vendor
      - testdata
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
          - funlen
          - cyclop
          - contextcheck

run:
  timeout: 5m
