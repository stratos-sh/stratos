apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-scaleup-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e2e-scaleup
  template:
    metadata:
      labels:
        app: e2e-scaleup
    spec:
      nodeSelector:
        workload: general
      containers:
      - name: nginx
        image: nginx:1.14.2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
