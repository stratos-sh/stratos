---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: nodepools.stratos.sh
spec:
  group: stratos.sh
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    shortNames:
    - np
    - npool
    singular: nodepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolSize
      name: PoolSize
      type: integer
    - jsonPath: .spec.minStandby
      name: MinStandby
      type: integer
    - jsonPath: .status.standby
      name: Standby
      type: integer
    - jsonPath: .status.running
      name: Running
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodePool is the Schema for the nodepools API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodePoolSpec defines the desired state of NodePool
            properties:
              maxNodeRuntime:
                description: |-
                  MaxNodeRuntime configures automatic node recycling.
                  Zero or nil means disabled.
                type: string
              minStandby:
                description: MinStandby is the minimum number of nodes to maintain
                  in stopped/standby state
                format: int32
                minimum: 0
                type: integer
              poolSize:
                description: PoolSize is the maximum total nodes (standby + running,
                  excluding warmup)
                format: int32
                maximum: 1000
                minimum: 1
                type: integer
              preWarm:
                description: PreWarm configures the pre-warming lifecycle
                properties:
                  completionMode:
                    allOf:
                    - enum:
                      - SelfStop
                      - ControllerStop
                    - enum:
                      - SelfStop
                      - ControllerStop
                    default: SelfStop
                    description: |-
                      CompletionMode controls how warmup completes:
                      - SelfStop (default): Instance self-stops via userdata script
                      - ControllerStop: Stratos stops instance when node is Ready
                    type: string
                  timeout:
                    description: |-
                      Timeout is how long to wait for warmup to complete.
                      In SelfStop mode, this is how long to wait for the instance to self-stop.
                      In ControllerStop mode, this is how long to wait for the node to become Ready.
                      Default: 10 minutes
                    type: string
                  timeoutAction:
                    allOf:
                    - enum:
                      - stop
                      - terminate
                    - enum:
                      - stop
                      - terminate
                    default: stop
                    description: TimeoutAction is what to do if warmup doesn't complete
                      in time.
                    type: string
                type: object
              reconciliationInterval:
                description: |-
                  ReconciliationInterval is how often to run the maintenance loop.
                  Default: 30 seconds
                type: string
              scaleDown:
                description: ScaleDown configures automatic scale-down behavior
                properties:
                  drainTimeout:
                    description: |-
                      DrainTimeout is the maximum time to wait for node drain.
                      Default: 5 minutes
                    type: string
                  emptyNodeTTL:
                    description: |-
                      EmptyNodeTTL is how long a node must be empty before scale-down.
                      Default: 5 minutes
                    type: string
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether automatic scale-down is enabled.
                      Default: true
                    type: boolean
                type: object
              scaleUp:
                description: ScaleUp configures scale-up behavior including resource-based
                  calculation
                properties:
                  defaultPodResources:
                    description: |-
                      DefaultPodResources specifies default resource requests for pods
                      that don't have explicit requests. Used in scale-up calculations
                      to estimate how many nodes are needed.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              template:
                description: Template defines the node template for this pool
                properties:
                  cloudProvider:
                    description: CloudProvider specifies the cloud provider configuration
                    properties:
                      aws:
                        description: AWS-specific configuration
                        properties:
                          ami:
                            description: AMI is the Amazon Machine Image ID
                            type: string
                          blockDeviceMappings:
                            description: BlockDeviceMappings defines the EBS volumes
                            items:
                              description: BlockDeviceMapping defines an EBS volume
                              properties:
                                deviceName:
                                  description: DeviceName is the device name (e.g.,
                                    "/dev/xvda")
                                  type: string
                                encrypted:
                                  description: Encrypted indicates whether the volume
                                    should be encrypted
                                  type: boolean
                                iops:
                                  description: IOPS is the number of I/O operations
                                    per second (for io1/io2 volumes)
                                  format: int32
                                  type: integer
                                throughput:
                                  description: Throughput is the throughput in MB/s
                                    (for gp3 volumes)
                                  format: int32
                                  type: integer
                                volumeSize:
                                  description: VolumeSize is the volume size in GiB
                                  format: int32
                                  minimum: 1
                                  type: integer
                                volumeType:
                                  description: VolumeType is the EBS volume type (e.g.,
                                    "gp3", "io1")
                                  type: string
                              required:
                              - deviceName
                              - volumeSize
                              - volumeType
                              type: object
                            type: array
                          iamInstanceProfile:
                            description: IAMInstanceProfile is the IAM instance profile
                              ARN or name
                            type: string
                          instanceType:
                            description: InstanceType is the EC2 instance type (e.g.,
                              "m5.large")
                            type: string
                          region:
                            description: Region is the AWS region (e.g., "us-east-1")
                            type: string
                          securityGroupIds:
                            description: SecurityGroupIDs is the list of security
                              groups
                            items:
                              type: string
                            minItems: 1
                            type: array
                          subnetIds:
                            description: SubnetIDs is the list of subnets to launch
                              instances in
                            items:
                              type: string
                            minItems: 1
                            type: array
                          tags:
                            additionalProperties:
                              type: string
                            description: Tags to apply to instances
                            type: object
                          userData:
                            description: |-
                              UserData is the base64-encoded user data script.
                              This script should join the cluster and self-stop when ready.
                            type: string
                        required:
                        - ami
                        - iamInstanceProfile
                        - instanceType
                        - securityGroupIds
                        - subnetIds
                        type: object
                      provider:
                        description: Provider is the cloud provider type
                        enum:
                        - aws
                        - gcp
                        - azure
                        type: string
                    required:
                    - provider
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels to apply to nodes
                    type: object
                  startupTaintRemoval:
                    default: WhenNetworkReady
                    description: |-
                      StartupTaintRemoval determines how startup taints are removed:
                      - WhenNetworkReady (default): Stratos removes taints when network conditions indicate CNI is ready
                      - External: Stratos waits for taints to be removed by CNI plugin or external controller
                    enum:
                    - WhenNetworkReady
                    - External
                    type: string
                  startupTaints:
                    description: |-
                      StartupTaints are taints applied during node startup that block pod scheduling
                      until the node is fully ready. These should match the taints configured in
                      kubelet --register-with-taints. Stratos will remove these taints based on
                      the StartupTaintRemoval mode.
                    items:
                      description: |-
                        The node this Taint is attached to has the "effect" on
                        any pod that does not tolerate the Taint.
                      properties:
                        effect:
                          description: |-
                            Required. The effect of the taint on pods
                            that do not tolerate the taint.
                            Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: Required. The taint key to be applied to a
                            node.
                          type: string
                        timeAdded:
                          description: TimeAdded represents the time at which the
                            taint was added.
                          format: date-time
                          type: string
                        value:
                          description: The taint value corresponding to the taint
                            key.
                          type: string
                      required:
                      - effect
                      - key
                      type: object
                    type: array
                  taints:
                    description: Taints to apply to nodes (permanent taints for workload
                      isolation)
                    items:
                      description: |-
                        The node this Taint is attached to has the "effect" on
                        any pod that does not tolerate the Taint.
                      properties:
                        effect:
                          description: |-
                            Required. The effect of the taint on pods
                            that do not tolerate the taint.
                            Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: Required. The taint key to be applied to a
                            node.
                          type: string
                        timeAdded:
                          description: TimeAdded represents the time at which the
                            taint was added.
                          format: date-time
                          type: string
                        value:
                          description: The taint value corresponding to the taint
                            key.
                          type: string
                      required:
                      - effect
                      - key
                      type: object
                    type: array
                required:
                - cloudProvider
                type: object
            required:
            - minStandby
            - poolSize
            - template
            type: object
          status:
            description: NodePoolStatus defines the observed state of NodePool
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastReconcileTime:
                description: LastReconcileTime is when the pool was last reconciled
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation
                format: int64
                type: integer
              running:
                description: Running is the count of nodes actively running pods
                format: int32
                type: integer
              standby:
                description: Standby is the count of nodes in stopped/standby state
                format: int32
                type: integer
              total:
                description: Total is the total node count (warmup + standby + running)
                format: int32
                type: integer
              warmup:
                description: Warmup is the count of nodes currently initializing
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
