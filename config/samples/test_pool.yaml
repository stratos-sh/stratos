apiVersion: stratos.sh/v1alpha1
kind: NodePool
metadata:
  name: test-pool
spec:
  minStandby: 2
  poolSize: 2
  preWarm:
    timeout: 10m0s
    timeoutAction: stop
  reconciliationInterval: 30s
  scaleDown:
    drainTimeout: 2m0s
    emptyNodeTTL: 2m0s
    enabled: true
  template:
    cloudProvider:
      aws:
        ami: ami-071a9f2683c2da4bd
        blockDeviceMappings:
        - deviceName: /dev/xvda
          encrypted: true
          volumeSize: 20
          volumeType: gp3
        iamInstanceProfile: arn:aws:iam::123456789012:instance-profile/StratosNodeRole
        instanceType: m8i.large
        region: us-east-1
        securityGroupIds:
        - sg-0123456789abcdef0
        subnetIds:
        - subnet-0123456789abcdef0
        tags:
          Environment: test
        userData: |
          #!/bin/bash
          set -ex

          /etc/eks/bootstrap.sh main \
            --kubelet-extra-args '--register-with-taints=node.eks.amazonaws.com/not-ready=true:NoSchedule'

          echo "DEBUG: bootstrap.sh completed, waiting for kubelet to be healthy..."

          until curl -sf http://localhost:10248/healthz >/dev/null 2>&1; do
            echo "DEBUG: kubelet not healthy yet..."
            sleep 5
          done
          echo "DEBUG: kubelet is healthy"

          sleep 30

          echo "DEBUG: shutting down..."
          poweroff
      provider: aws
    labels:
      stratos.sh/pool: test-pool
    startupTaintRemoval: WhenNetworkReady
    startupTaints:
    - effect: NoSchedule
      key: node.eks.amazonaws.com/not-ready
      value: "true"
