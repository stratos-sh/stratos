apiVersion: stratos.sh/v1alpha1
kind: NodePool
metadata:
  name: test-pool-al2023
spec:
  minStandby: 2
  poolSize: 2
  preWarm:
    # completionMode: SelfStop (default) - Instance self-stops via userdata script
    # completionMode: ControllerStop - Stratos stops instance when node is Ready
    #   Use ControllerStop for OS images that can't run shutdown scripts
    #   (e.g., Bottlerocket with TOML-only configuration)
    timeout: 10m0s
    timeoutAction: stop
  reconciliationInterval: 30s
  scaleDown:
    drainTimeout: 1m0s
    emptyNodeTTL: 1m0s
    enabled: true
  template:
    cloudProvider:
      aws:
        # AL2023 ARM64 AMI (EKS 1.34)
        ami: ami-00171c2155dff951e
        blockDeviceMappings:
        - deviceName: /dev/xvda
          encrypted: true
          volumeSize: 20
          volumeType: gp3
        iamInstanceProfile: arn:aws:iam::123456789012:instance-profile/StratosNodeRole
        # ARM instance type to match ARM64 AMI
        instanceType: m8g.large
        region: us-east-1
        securityGroupIds:
        - sg-0123456789abcdef0
        subnetIds:
        - subnet-0123456789abcdef0
        tags:
          Environment: test
        # AL2023 uses nodeadm with MIME multipart user data
        userData: |
          MIME-Version: 1.0
          Content-Type: multipart/mixed; boundary="BOUNDARY"

          --BOUNDARY
          Content-Type: application/node.eks.aws

          ---
          apiVersion: node.eks.aws/v1alpha1
          kind: NodeConfig
          spec:
            cluster:
              name: main
              apiServerEndpoint: https://ABCDEF1234567890.gr7.us-east-1.eks.amazonaws.com
              certificateAuthority: YOUR_CLUSTER_CA_BASE64
              cidr: 10.100.0.0/16
            kubelet:
              config:
                # Faster node status updates (default 10s)
                nodeStatusUpdateFrequency: 2s
                # Faster node status report even when unchanged (default 5m)
                nodeStatusReportFrequency: 10s
              flags:
                - --register-with-taints=node.eks.amazonaws.com/not-ready=true:NoSchedule

          --BOUNDARY
          Content-Type: text/x-shellscript; charset="us-ascii"

          #!/bin/bash
          # Stratos warmup script: wait for kubelet to be healthy, then stop the instance
          # Run in background so cloud-init can complete and nodeadm can start

          (
            set -ex
            echo "DEBUG: Stratos warmup script started in background"

            # Wait for kubelet to be healthy (nodeadm must complete first)
            echo "DEBUG: Waiting for kubelet to be healthy..."
            until curl -sf http://localhost:10248/healthz >/dev/null 2>&1; do
              sleep 5
            done
            echo "DEBUG: kubelet is healthy"

            # Give the node time to fully register and stabilize
            sleep 30

            # Initialize EBS volume by reading all blocks
            # This forces lazy-loaded snapshot data to be fetched from S3 now,
            # so the volume is fully initialized before stopping.
            # When the instance restarts, all blocks are local - no S3 latency.
            echo "DEBUG: Initializing EBS root volume (reading all blocks)..."
            ROOT_DEVICE=$(lsblk -no PKNAME $(findmnt -n -o SOURCE /))
            dd if=/dev/${ROOT_DEVICE} of=/dev/null bs=1M status=progress 2>&1 || true
            echo "DEBUG: EBS volume initialization complete"

            echo "DEBUG: shutting down for Stratos standby..."
            poweroff
          ) &> /var/log/stratos-warmup.log &

          --BOUNDARY--
      provider: aws
    labels:
      stratos.sh/pool: test-pool-al2023
    startupTaintRemoval: WhenNetworkReady
    startupTaints:
    - effect: NoSchedule
      key: node.eks.amazonaws.com/not-ready
      value: "true"
