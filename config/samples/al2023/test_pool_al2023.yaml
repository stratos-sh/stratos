# NodePool using AL2023 AWSNodeClass
#
# This NodePool references an AWSNodeClass for AWS-specific configuration.
# The referenced AWSNodeClass must exist before creating this NodePool.
#
# Apply the AWSNodeClass first:
#   kubectl apply -f awsnodeclass_al2023.yaml
# Then apply this NodePool:
#   kubectl apply -f test_pool_al2023.yaml

apiVersion: stratos.sh/v1alpha1
kind: NodePool
metadata:
  name: test-pool-al2023
spec:
  minStandby: 2
  poolSize: 2
  preWarm:
    # SelfStop (default): Instance self-stops via userdata script
    # Use this for AL2023 which supports shell scripts in user data
    timeout: 10m0s
    timeoutAction: stop
  reconciliationInterval: 30s
  scaleDown:
    drainTimeout: 1m0s
    emptyNodeTTL: 1m0s
    enabled: true
  template:
    # Reference to AWSNodeClass containing AWS-specific configuration
    nodeClassRef:
      kind: AWSNodeClass
      name: al2023-standard
    labels:
      stratos.sh/pool: test-pool-al2023
    startupTaintRemoval: WhenNetworkReady
    startupTaints:
      - effect: NoSchedule
        key: node.eks.amazonaws.com/not-ready
        value: "true"
