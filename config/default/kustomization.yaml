# Kustomization for deploying Stratos controller
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: stratos-system

# Labels added to all resources
commonLabels:
  app.kubernetes.io/name: stratos
  app.kubernetes.io/component: controller

# Resources to include
resources:
  - ../crd/bases/stratos.sh_nodepools.yaml
  - ../rbac/service_account.yaml
  - ../rbac/role.yaml
  - ../rbac/role_binding.yaml
  - ../manager/manager.yaml

# Images to replace
images:
  - name: controller
    newName: stratos/controller
    newTag: latest

# Generate namespace
generatorOptions:
  disableNameSuffixHash: true

# Patches for customization
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLUSTER_NAME
          value: "my-cluster"
    target:
      kind: Deployment
      name: stratos-controller-manager
