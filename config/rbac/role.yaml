apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stratos-controller
rules:
  # NodePool CRD - full access
  - apiGroups:
      - stratos.sh
    resources:
      - nodepools
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # NodePool status subresource
  - apiGroups:
      - stratos.sh
    resources:
      - nodepools/status
    verbs:
      - get
      - update
      - patch

  # NodePool finalizers
  - apiGroups:
      - stratos.sh
    resources:
      - nodepools/finalizers
    verbs:
      - update

  # Nodes - full access (create, update, delete for management)
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Node status (for updating conditions)
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - get
      - update
      - patch

  # Pods - watch only (for detecting unschedulable pods)
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  # Pod eviction (for draining nodes)
  - apiGroups:
      - ""
    resources:
      - pods/eviction
    verbs:
      - create

  # Events - create only (for operational visibility)
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

  # PodDisruptionBudgets - read only (for drain planning)
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch

  # Leases - for leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
# Role for accessing secrets in the stratos-system namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stratos-controller
  namespace: stratos-system
rules:
  # Secrets - read only (for cloud provider credentials if needed)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  # ConfigMaps - read only (for configuration)
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
