apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stratos-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stratos-controller
subjects:
  - kind: ServiceAccount
    name: stratos-controller
    namespace: stratos-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stratos-controller
  namespace: stratos-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stratos-controller
subjects:
  - kind: ServiceAccount
    name: stratos-controller
    namespace: stratos-system
